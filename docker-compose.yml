services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cpuenterprise
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    # Non-strict mode, matching the XAMPP/shared-host MySQL this app was written against
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: cpuenterprise
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

volumes:
  db_data:
